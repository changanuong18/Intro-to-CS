<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - DUEUP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-xl p-8 border border-slate-200 dark:border-slate-700">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class=" text-white w-12 h-12 rounded-x3 flex items-center justify-center mx-auto mb-3">
                <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo DUEUP" class="w-10 h-10 rounded-full object-cover">
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">DUEUP</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Đăng nhập để quản lý tiến độ học tập của bạn</p>
        </div>

        <!-- Hiển thị lỗi nếu có -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-xs font-medium bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Form Đăng nhập tài khoản nội bộ -->
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Tên đăng nhập / Email</label>
                <input type="text" name="username" required placeholder="Nhập tên đăng nhập..." class="w-full text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Mật khẩu</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow-md transition">
                Đăng nhập
            </button>
        </form>

        <div class="text-center mt-3 text-xs">
            <span class="text-slate-500 dark:text-slate-400">Chưa có tài khoản?</span> 
            <a href="/register" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">Đăng ký ngay</a>
        </div>

        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
            <span class="flex-shrink mx-4 text-xs text-slate-400 uppercase">Hoặc</span>
            <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
        </div>

        <!-- Nút Đăng nhập Google -->
        <a href="/login/google" class="w-full bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-950 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-700 font-semibold py-2.5 rounded-lg text-sm shadow-sm transition flex items-center justify-center space-x-2">
            <i class="fa-brands fa-google text-red-500 text-base"></i>
            <span>Đăng nhập bằng Google</span>
        </a>
    </div>

</body>
</html>
